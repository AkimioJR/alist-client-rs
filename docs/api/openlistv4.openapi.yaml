                  type: string
                  title: 驱动类型
                  description: 驱动类型名称
                is_enabled:
                  type: boolean
                  title: 是否启用
                  description: 是否启用挂载
                drive_conf:
                  type: string
                  title: 配置信息
                  description: 挂载配置信息
                cache_time:
                  type: integer
                  title: 缓存时间
                  description: 全局缓存时间
              x-apifox-orders:
              - mount_path
