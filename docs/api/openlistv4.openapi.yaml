        but only within the receiving window [frontier, frontier+8), which slides forward as the driver consumes data. Every
        chunk except the last must be exactly chunk_size bytes; the last one is the remainder. When the window is full the
        request parks on the server for up to 10 seconds waiting for a free slot before answering 429. If the session already
        completed (e.g. rapid upload) the chunk is absorbed idempotently and the returned snapshot has state=completed — stop
        sending the remaining chunks. The server always consumes the request body before answering, so browsers never see
        an early response.
