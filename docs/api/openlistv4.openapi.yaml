  /@path/{action}/{method}/{driver}:
    get:
      summary: 挂载管理接口
      deprecated: false
      description: |-
        ## 接口用途
        负责挂载部分的管理

        ## 接口示例

        ### 列出挂载

        | 示例操作                    | 含义                          |
        | :-------------------------- | :---------------------------- |
        | `/@path/select/none/`       | 查找并列出所有的挂载信息      |
        | `/@path/select/path/path1/` | 查找并列出`/path1/`的挂载信息 |
        | `/@path/select/uuid/12345/` | 查找并列出`ID12345`的挂载信息 |


        ### 创建挂载

        | 示例操作                                 | 含义                                            |
        | :--------------------------------------- | :---------------------------------------------- |
        | `/@path/create/path/path1/?config={...}` | 创建一个`/path1/`的挂载信息，此路径必须是唯一的 |

        ### 删除挂载

        | 示例操作                    | 含义                          |
        | :-------------------------- | :---------------------------- |
        | `/@path/remove/path/path1/` | 删除 `/path1/`挂载 |
        | `/@path/remove/uuid/12345/` | 删除`ID12345`挂载 |

        ### 载入挂载

        | 示例操作                    | 含义                          |
        | :-------------------------- | :---------------------------- |
        | `/@path/reload/path/path1/` | 载入 `/path1/`挂载 |
        | `/@path/reload/uuid/12345/` | 载入`ID12345`挂载 |

        ### 修改挂载

        | 示例操作                    | 含义                          |
        | :-------------------------- | :---------------------------- |
        | `/@path/reload/path/path1/?config={...}` | 修改 `/path1/`挂载 |
        | `/@path/reload/uuid/12345/?config={...}` | 修改`ID12345`挂载 |
      tags:
      - TS版本接口
      parameters:
      - name: action
        in: path
        description: 必要：驱动操作，创建挂载、删除挂载、载入驱动、查找驱动、配置驱动
        required: true
        example: create、remove、reload、select、config
        schema:
          type: string
      - name: method
        in: path
        description: 必要：筛选方式，路径path、编号uuid、不筛选none（仅限查找时使用）
        required: true
        example: path、uuid、none
        schema:
          type: string
      - name: driver
        in: path
        description: 必要：筛选内容，路径则使用路径定位、uuid则使用uuid定位
        required: true
        example: /path1/、12345
        schema:
          type: string
      - name: config
        in: query
        description: 可选：驱动配置，创建、修改时需要（GET时才需要，POST参考BODY部分）
        required: false
        example: '{...}'
