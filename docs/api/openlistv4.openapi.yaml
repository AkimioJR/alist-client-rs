  /api/fs/multipart/init:
    post:
      summary: Init multipart upload
      deprecated: false
      description: 'Create an upload session and immediately start the server-to-driver upload pipeline, or resume an existing
        one. Session reuse rules (same user + path + size): a live "receiving" session is resumed only when the supplied file
        hashes match the ones it was created with — without hashes, path+size cannot prove file identity, so no resume; a
        "failed_retriable" session is always reused (its buffered data was already discarded, refill is guarded by per-chunk
        CRC); any other existing session is superseded and cleaned up. Supplied file hashes travel ahead of the file data,
        so drivers with server-side deduplication can finish instantly (rapid upload) without receiving any chunk.'
      tags:
      - File System
      parameters:
      - name: File-Path
        in: header
        description: URL-encoded destination path (same as /fs/put)
        required: true
        example: /uploads/movie.mkv
        schema:
          type: string
      - name: X-File-Size
        in: header
        description: file size in bytes; upload empty files via /fs/put
        required: true
        example: ''
        schema:
          type: integer
          format: int64
          minimum: 1
      - name: X-Chunk-Size
        in: header
        description: suggested chunk bytes, clamped to [1MB, admin setting]; the effective value is returned as chunk_size
        required: false
        example: ''
        schema:
          type: integer
          format: int64
      - name: Overwrite
        in: header
        description: when false, reject if the target already exists
        required: false
        example: ''
        schema:
          type: boolean
          default: true
      - name: X-File-Md5
        in: header
        description: MD5 of the file; enables rapid upload and identifies the file for resume
        required: false
        example: ''
        schema:
          type: string
      - name: X-File-Sha1
        in: header
        description: SHA1 of the file; enables rapid upload and identifies the file for resume
        required: false
        example: ''
        schema:
          type: string
      - name: X-File-Sha256
        in: header
        description: SHA256 of the file; enables rapid upload and identifies the file for resume
        required: false
        example: ''
        schema:
          type: string
      - name: Last-Modified
        in: header
        description: file modification time (Unix timestamp in milliseconds)
        required: false
        example: ''
        schema:
          type: integer
          format: int64
      - name: Content-Type
        in: header
        description: file MIME type, inferred from the extension when omitted
        required: false
        example: ''
        schema:
          type: string
      responses:
        '200':
          x-apifox-name: Success
          description: Session created or resumed; data is the session snapshot plus resumed
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Envelope'
                - type: object
                  properties:
                    data:
                      allOf:
                      - $ref: '#/components/schemas/SessionSnapshot'
                      - type: object
                        properties:
                          resumed:
                            type: boolean
                            description: true when an existing session was reused; skip the chunk ranges listed in received
                        x-apifox-orders:
                        - resumed
                        x-apifox-ignore-properties: []
                  x-apifox-orders:
                  - data
                  x-apifox-ignore-properties: []
              example:
                code: 200
                message: success
                data:
                  upload_id: 3f2c9e2a-6c4b-4d2e-9a2b-1f0e8c7d5a41
                  state: receiving
                  attempt: 0
                  path: /uploads/movie.mkv
                  size: 734003200
                  chunk_size: 10485760
                  total_chunks: 70
                  received:
                  - - 0
                    - 2
                  received_bytes: 31457280
                  frontier: 3
                  storage_progress: 4.29
                  resumed: true
          headers: {}
          x-apifox-ordering: 0
        '400':
          x-apifox-name: Bad Request
          description: Invalid File-Path, X-File-Size or X-Chunk-Size
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 400
                message: multipart upload requires a valid X-File-Size header
                data: null
          headers: {}
          x-apifox-ordering: 1
        '401':
          x-apifox-name: Unauthorized
          description: Not logged in or the token has expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Envelope'
              example:
                code: 401
                message: token is expired
                data: null
          headers: {}
          x-apifox-ordering: 2
        '403':
