              - cache_time
              required:
              - mount_path
              - mount_type
              - is_enabled
              - drive_conf
              - cache_time
              x-apifox-ignore-properties: []
            examples: {}
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
                x-apifox-ignore-properties: []
                x-apifox-orders: []
          headers: {}
          x-apifox-name: 成功
          x-apifox-ordering: 0
